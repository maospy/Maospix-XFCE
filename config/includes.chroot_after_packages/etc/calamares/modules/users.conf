# maospix-xfce: basado en calamares-settings-debian; shell fish y nombre de equipo maospix
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
displayAutologin: true   # casilla "Iniciar sesión automáticamente" (desmarcada)
sudoersGroup:    sudo
setRootPassword: false

# Contraseñas cortas permitidas sin aviso (mínimo 1 caracter); sin contraseña de root, se usa sudo
allowWeakPasswords: true
allowWeakPasswordsDefault: true

passwordRequirements:
    nonempty: true
    minLength: 1
    maxLength: -1

user:
    shell: /usr/bin/fish
    forbidden_names: [ root, liveuser ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "maospix-${first}"
    forbidden_names: [ localhost ]
