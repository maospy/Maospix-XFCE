# maospix-xfce: borra lo que es solo del live (corre dentro del sistema instalado)
---
dontChroot: false
timeout: 60
script:
    - command: "rm -rf /etc/calamares"
      timeout: 10
    - "rm -f /usr/share/applications/maospix-instalar.desktop /etc/xdg/autostart/maospix-instalar-icono.desktop /usr/libexec/maospix/instalar-icono"
    - "rm -f /etc/sudoers.d/live /etc/lightdm/lightdm.conf.d/*live*.conf"
    - "-sed -i '/^autologin-user=liveuser$/d' /etc/lightdm/lightdm.conf"
    - "-userdel -r liveuser"
