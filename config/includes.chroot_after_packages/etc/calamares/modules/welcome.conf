# maospix-xfce: requisitos más bajos que Debian (15 GB → 10 GB)
---
showSupportUrl:         true
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    10
    requiredRam:        1.0
    internetCheckUrl:   http://deb.debian.org
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
