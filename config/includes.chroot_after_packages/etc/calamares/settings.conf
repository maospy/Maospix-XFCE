# maospix-xfce: basado en calamares-settings-debian 14.0.2
# Cambios: branding maospix y "limpiar-live" (shellprocess) al final de la instalación.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     limpiar-live
  module: shellprocess
  config: shellprocess-limpiar-live.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - shellprocess@limpiar-live
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: maospix
prompt-install: false
dont-chroot: false
