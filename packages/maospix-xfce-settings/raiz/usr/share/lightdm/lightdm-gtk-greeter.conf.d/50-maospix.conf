# maospix — pantalla de inicio de sesión
[greeter]
background=/usr/share/backgrounds/maospix/maospix-maospix.png
user-background=false
theme-name=Maospix-Dark
icon-theme-name=Maospix-Papirus-Dark
cursor-theme-name=Bibata-Modern-Ice
cursor-theme-size=24
font-name=Inter 11
xft-hintstyle=hintslight
default-user-image=/usr/share/maospix/maospix-logo-neon.png
clock-format=%A %d de %B   %H:%M
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
position=50%,center 50%,center
